name: preview

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Record source version
        id: version
        run: |
          VERSION="$(uv run evdb --version)"
          echo "version=${VERSION#evdb }" >> "${GITHUB_OUTPUT}"
      - run: make check

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: make binary
      - name: Smoke test standalone executable
        run: |
          uv run pyi-archive_viewer -r -b dist/evdb > binary-members.txt
          grep -F "evdb/units/evdb-backup.service" binary-members.txt
          grep -F "evdb/units/evdb-backup.timer" binary-members.txt
          grep -Fx " rich.console" binary-members.txt
          grep -Fx " prompt_toolkit.shortcuts.prompt" binary-members.txt
      - name: Assemble preview executable
        env:
          VERSION: ${{ needs.check.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          ASSET="evdb_linux_${ARCH}_${GITHUB_SHA}_${GITHUB_RUN_NUMBER}_${GITHUB_RUN_ATTEMPT}"
          install -d -m 0755 artifacts
          install -m 0755 dist/evdb "artifacts/${ASSET}"
          (cd artifacts && sha256sum "${ASSET}" > "${ASSET}.sha256")
          uv run python tools/check_release.py "artifacts/${ASSET}" "${VERSION}" --preview
      - uses: actions/upload-artifact@v7
        with:
          name: preview-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [check, build]
    runs-on: ubuntu-22.04
    concurrency:
      group: preview-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: preview-*
          path: release
          merge-multiple: true
      - name: Attest preview executables
        uses: actions/attest@v4
        with:
          subject-path: release/evdb_linux_*
      - name: Publish versioned preview
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          TAG="v${VERSION%%+*}"
          case "${TAG}" in
            *.dev[0-9]*) ;;
            *) echo "Source is a stable version; no preview to publish."; exit 0 ;;
          esac
          if DRAFT="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"; then
            if test "${DRAFT}" = false; then
              echo "${TAG} is already published; skipping."
              exit 0
            fi
          else
            gh release create "${TAG}" --draft --prerelease --latest=false \
              --target "${GITHUB_SHA}" --title "${TAG}" \
              --notes "Main build: ${VERSION} (${GITHUB_SHA}). Install with --preview."
          fi
          install -m 0755 install.sh release/install.sh
          printf '%s %s %s %s\n' "${GITHUB_SHA}" "${VERSION}" \
            "${GITHUB_RUN_NUMBER}" "${GITHUB_RUN_ATTEMPT}" > release/preview.txt
          gh release upload "${TAG}" release/evdb_linux_* release/install.sh release/preview.txt --clobber
          gh release edit "${TAG}" --draft=false --prerelease --latest=false
