name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest
      - run: uv run python -m evanovation_db.cli validate --source config/montreal-01
      - run: uv run ansible-playbook --syntax-check -i ansible/test-hosts.yml ansible/backup.yml
      - run: uv run ansible-playbook --syntax-check -i ansible/test-hosts.yml ansible/databases.yml
      - run: uv run ansible-playbook --syntax-check -i ansible/test-hosts.yml ansible/restore.yml
      - run: systemd-analyze verify systemd/*.service systemd/*.timer
