host:
  id: test-02
  ssh: deploy@test-02
  domain: storage.example.com
  data_root: /srv/databases
  images:
    postgres: postgres:16
    pgbouncer: edoburu/pgbouncer:v1.25.1-p0
    redis: redis:7.2.5
    dragonfly: docker.dragonflydb.io/dragonflydb/dragonfly:v1.34.1
    http: hiett/serverless-redis-http@sha256:5555555555555555555555555555555555555555555555555555555555555555
    traefik: traefik:v3.7.8
  backup:
    repos:
      postgres: local:/backups/postgres
      kv: local:/backups/kv
    retention:
      daily: 3
    min_free_gb: 10
    max_age_hours: 30
    restore_max_age_days: 14
  one_password:
    vault: Test
    system_item: evanovation-db
  http_ports:
    start: 14000
    end: 14009

databases:
  - name: pooled-prod-01
    type: postgres
    pooler: false
    max_clients: 500
    pool_size: 40
    reserve_size: 8
  - name: transient-prod-01
    type: dragonfly
    mode: cache
    memory: 2gb
    threads: 8
    http: false
