[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evanovation-db"
version = "0.1.0"
description = "Database backup, restore, and deployment tools for Evanovation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "ansible-core>=2.17,<2.21",
  "pytest>=8.3",
  "PyYAML>=6.0",
  "ruff>=0.12",
]

[project.scripts]
evdb = "evanovation_db.controller:main"
evanovation-db = "evanovation_db.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
