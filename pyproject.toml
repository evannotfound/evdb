[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evanovation-db"
version = "0.1.0"
description = "Host-local database management for Evanovation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.scripts]
evdb = "evanovation_db.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evanovation_db = ["units/*.service", "units/*.timer"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
