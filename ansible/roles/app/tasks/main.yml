---
- name: Create host runtime source directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ evdb_admin_user }}"
    group: "{{ evdb_admin_group }}"
    mode: "0755"
  loop:
    - "{{ evdb_runtime_root }}/src"
    - "{{ evdb_runtime_root }}/src/evanovation_db"
  when: evdb_plan | bool

- name: Find internal host runtime source directories
  ansible.builtin.find:
    paths: "{{ evdb_repo }}/src/evanovation_db"
    file_type: directory
    recurse: true
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: evdb_runtime_directories

- name: Create internal host runtime package directories
  ansible.builtin.file:
    path: >-
      {{ evdb_runtime_root }}/src/{{ item.path | relpath(evdb_repo + '/src') }}
    state: directory
    owner: "{{ evdb_admin_user }}"
    group: "{{ evdb_admin_group }}"
    mode: "0755"
  loop: "{{ evdb_runtime_directories.files }}"
  loop_control:
    label: "{{ item.path | relpath(evdb_repo + '/src') }}"
  when: evdb_plan | bool

- name: Find internal host runtime Python files
  ansible.builtin.find:
    paths: "{{ evdb_repo }}/src/evanovation_db"
    patterns: "*.py"
    file_type: file
    recurse: true
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: evdb_runtime_files

- name: Install internal host runtime Python files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: >-
      {{ evdb_runtime_root }}/src/{{ item.path | relpath(evdb_repo + '/src') }}
    owner: "{{ evdb_admin_user }}"
    group: "{{ evdb_admin_group }}"
    mode: "0644"
  loop: "{{ evdb_runtime_files.files }}"
  loop_control:
    label: "{{ item.path | relpath(evdb_repo + '/src') }}"
  when: evdb_plan | bool

- name: Check installed host runtime Python files
  ansible.builtin.command:
    argv:
      - "{{ evdb_python }}"
      - -m
      - compileall
      - -q
      - "{{ evdb_runtime_root }}/src/evanovation_db"
  changed_when: false
  when:
    - evdb_write | bool
    - not ansible_check_mode
