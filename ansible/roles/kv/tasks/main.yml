---
- name: Select normalized KV databases
  ansible.builtin.set_fact:
    evdb_kv: "{{ evdb_databases | rejectattr('engine', 'equalto', 'postgres') | list }}"

- name: Validate direct KV runtime fields
  ansible.builtin.assert:
    that:
      - instance.engine in ['redis', 'dragonfly']
      - instance.image is string
      - "'@sha256:' in instance.image"
      - instance.data is string
      - instance.settings is mapping
      - instance.http is mapping
    fail_msg: "{{ instance.id }} must use normalized KV image, data, settings, and HTTP fields"
  loop: "{{ evdb_kv }}"
  loop_control:
    loop_var: instance
    label: "{{ instance.id }} ({{ instance.engine }})"
