---
- name: Resolve KV password on the controller
  ansible.builtin.command:
    argv:
      - op
      - read
      - "{{ instance.secrets.password }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: evdb_kv_password
  no_log: true

- name: Write KV password file
  ansible.builtin.copy:
    content: "{{ evdb_kv_password.stdout }}\n"
    dest: "{{ evdb_secret_dir }}/kv-{{ instance.id }}.password"
    owner: "{{ evdb_user }}"
    group: "{{ evdb_group }}"
    mode: "0600"
  no_log: true

- name: Write private Redis config
  ansible.builtin.copy:
    content: |
      bind 0.0.0.0
      port 6379
      dir /data
      dbfilename dump.rdb
      appendonly no
      save 900 1
      save 300 10
      save 60 10000
      requirepass {{ evdb_kv_password.stdout | to_json }}
    dest: "{{ evdb_secret_dir }}/kv-{{ instance.id }}.conf"
    owner: "{{ evdb_user }}"
    group: "{{ evdb_group }}"
    mode: "0600"
  no_log: true
  when: instance.engine == 'redis'

- name: Write private Dragonfly flag file
  ansible.builtin.copy:
    content: |
      --dir=/data
      --dbfilename=dump.rdb
      --requirepass={{ evdb_kv_password.stdout | to_json }}
      --proactor_threads={{ instance.settings.threads }}
      --maxmemory={{ instance.settings.maxmemory }}
    dest: "{{ evdb_secret_dir }}/kv-{{ instance.id }}.flags"
    owner: "{{ evdb_user }}"
    group: "{{ evdb_group }}"
    mode: "0600"
  no_log: true
  when: instance.engine == 'dragonfly'

- name: Resolve HTTP token on the controller
  ansible.builtin.command:
    argv:
      - op
      - read
      - "{{ instance.http.token }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: evdb_http_token
  no_log: true
  when: instance.http.enabled | bool

- name: Write private HTTP environment
  ansible.builtin.copy:
    content: |
      SRH_TOKEN={{ evdb_http_token.stdout | to_json }}
      SRH_CONNECTION_STRING={{ ('redis://default:' + (evdb_kv_password.stdout | urlencode) + '@' + instance.container + ':6379') | to_json }}
    dest: "{{ evdb_secret_dir }}/kv-{{ instance.id }}-http.env"
    owner: "{{ evdb_user }}"
    group: "{{ evdb_group }}"
    mode: "0600"
  no_log: true
  when: instance.http.enabled | bool

- name: Write private HTTP token
  ansible.builtin.copy:
    content: "{{ evdb_http_token.stdout }}\n"
    dest: "{{ evdb_secret_dir }}/kv-{{ instance.id }}-http.token"
    owner: "{{ evdb_user }}"
    group: "{{ evdb_group }}"
    mode: "0600"
  no_log: true
  when: instance.http.enabled | bool
