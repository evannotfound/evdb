---
- name: Refresh normalized bootstrap runtime host JSON
  ansible.builtin.copy:
    content: "{{ {'host': evdb_host} | to_nice_json }}\n"
    dest: "{{ evdb_bootstrap_runtime }}/host.json"
    owner: "{{ evdb_admin_user }}"
    group: "{{ evdb_group }}"
    mode: "0640"
  when: evdb_plan | bool

- name: Initialize expected bootstrap runtime database files
  ansible.builtin.set_fact:
    evdb_bootstrap_instances: []

- name: Collect expected bootstrap runtime database files
  ansible.builtin.set_fact:
    evdb_bootstrap_instances: >-
      {{ evdb_bootstrap_instances +
         [('postgres' if item.engine == 'postgres' else 'kv') ~ '-' ~ item.id ~ '.json'] }}
  loop: "{{ evdb_databases }}"
  loop_control:
    label: "{{ item.engine }}/{{ item.id }}"

- name: Refresh normalized bootstrap runtime database JSON
  ansible.builtin.copy:
    content: "{{ {'instance': item} | to_nice_json }}\n"
    dest: >-
      {{ evdb_bootstrap_runtime }}/instances/{{ 'postgres' if item.engine == 'postgres' else 'kv' }}-{{ item.id }}.json
    owner: "{{ evdb_admin_user }}"
    group: "{{ evdb_group }}"
    mode: "0640"
  loop: "{{ evdb_databases }}"
  loop_control:
    label: "{{ item.engine }}/{{ item.id }}"
  when: evdb_plan | bool

- name: Find installed bootstrap runtime database JSON
  ansible.builtin.find:
    paths: "{{ evdb_bootstrap_runtime }}/instances"
    patterns: "*.json"
    file_type: file
  register: evdb_installed_bootstrap_instances
  when: evdb_plan | bool

- name: Remove stale bootstrap runtime database JSON
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ evdb_installed_bootstrap_instances.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - evdb_plan | bool
    - item.path | basename not in evdb_bootstrap_instances
