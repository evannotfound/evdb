---
- name: Load Postgres deployment config
  ansible.builtin.include_vars:
    file: "{{ item.file }}"
    name: "{{ item.name }}"
  loop:
    - {file: "{{ evdb_source_dir }}/host.yml", name: evdb_host}
    - {file: "{{ evdb_source_dir }}/postgres.yml", name: evdb_postgres}

- name: Create Postgres render directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ evdb_admin_user }}"
    group: "{{ evdb_group }}"
    mode: "0750"
  loop:
    - "{{ evdb_config_dir }}/compose/postgres"
    - "{{ evdb_config_dir }}/pgbouncer"
  when: evdb_plan | bool

- name: Render Postgres Compose files
  ansible.builtin.template:
    src: "{{ evdb_repo }}/compose/postgres.yml.j2"
    dest: "{{ evdb_config_dir }}/compose/postgres/{{ instance.id }}.yml"
    owner: "{{ evdb_admin_user }}"
    group: "{{ evdb_group }}"
    mode: "0640"
  loop: "{{ evdb_postgres.instances }}"
  loop_control:
    loop_var: instance
    label: "{{ instance.id }}"
  vars:
    host: "{{ evdb_host.host }}"
    config_dir: "{{ evdb_config_dir }}"
    secret_dir: "{{ evdb_secret_dir }}"
  when: evdb_plan | bool

- name: Render PgBouncer config
  ansible.builtin.template:
    src: pgbouncer.ini.j2
    dest: "{{ evdb_config_dir }}/pgbouncer/{{ instance.id }}.ini"
    owner: "{{ evdb_admin_user }}"
    group: "{{ evdb_group }}"
    mode: "0640"
  loop: "{{ evdb_postgres.instances }}"
  loop_control:
    loop_var: instance
    label: "{{ instance.id }}"
  when:
    - evdb_plan | bool
    - instance.settings.pgbouncer | bool

- name: Write private Postgres files
  ansible.builtin.include_tasks: secret.yml
  loop: "{{ evdb_postgres.instances }}"
  loop_control:
    loop_var: instance
    label: "{{ instance.id }}"
  when:
    - evdb_write | bool
    - not ansible_check_mode
    - not evdb_skip_secrets | bool
