---
- name: Select normalized Postgres databases
  ansible.builtin.set_fact:
    evdb_postgres: "{{ evdb_databases | selectattr('engine', 'equalto', 'postgres') | list }}"

- name: Validate direct Postgres runtime fields
  ansible.builtin.assert:
    that:
      - instance.image is string
      - "'@sha256:' in instance.image"
      - instance.data is string
      - instance.settings is mapping
      - instance.http is none
    fail_msg: "{{ instance.id }} must use normalized Postgres image, data, and settings fields"
  loop: "{{ evdb_postgres }}"
  loop_control:
    loop_var: instance
    label: "{{ instance.id }}"
