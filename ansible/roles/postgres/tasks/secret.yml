---
- name: Resolve Postgres password on the controller
  ansible.builtin.command:
    argv:
      - op
      - read
      - "{{ instance.secrets.password }}"
  delegate_to: localhost
  become: false
  check_mode: false
  changed_when: false
  register: evdb_pg_password
  no_log: true

- name: Write Postgres password file
  ansible.builtin.copy:
    content: "{{ evdb_pg_password.stdout }}\n"
    dest: "{{ evdb_secret_dir }}/postgres-{{ instance.id }}.password"
    owner: "{{ evdb_user }}"
    group: "{{ evdb_group }}"
    mode: "0600"
  no_log: true

- name: Write private PgBouncer users file
  ansible.builtin.copy:
    content: "{{ instance.settings.user | to_json }} {{ evdb_pg_password.stdout | to_json }}\n"
    dest: "{{ evdb_secret_dir }}/postgres-{{ instance.id }}.users"
    owner: "{{ evdb_user }}"
    group: "{{ evdb_group }}"
    mode: "0600"
  no_log: true
  when: instance.settings.pgbouncer | bool
