---
- name: Validate normalized controller input
  ansible.builtin.assert:
    that:
      - evdb_config is mapping
      - evdb_config.host is mapping
      - evdb_config.databases is sequence
      - evdb_config.databases is not string
      - evdb_config.host.runtime | bool
    fail_msg: evdb_config must contain one normalized runtime host and databases list

- name: Select normalized host paths and databases
  ansible.builtin.set_fact:
    evdb_host: "{{ evdb_config.host }}"
    evdb_databases: "{{ evdb_config.databases }}"
    evdb_config_dir: "{{ evdb_config.host.config_dir }}"
    evdb_secret_dir: "{{ evdb_config.host.config_dir }}/secrets"
    evdb_state_dir: "{{ evdb_config.host.state_dir }}"

- name: Create service group
  ansible.builtin.group:
    name: "{{ evdb_group }}"
    system: true
  when:
    - evdb_manage_user | bool
    - evdb_write | bool

- name: Create service account
  ansible.builtin.user:
    name: "{{ evdb_user }}"
    group: "{{ evdb_group }}"
    groups:
      - docker
    append: true
    create_home: false
    shell: /usr/sbin/nologin
    system: true
  when:
    - evdb_manage_user | bool
    - evdb_write | bool

- name: Create deployment directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ evdb_root }}", owner: "{{ evdb_admin_user }}", group: "{{ evdb_admin_group }}", mode: "0755"}
    - {path: "{{ evdb_runtime_root }}", owner: "{{ evdb_admin_user }}", group: "{{ evdb_admin_group }}", mode: "0755"}
    - {path: "{{ evdb_bootstrap_runtime }}", owner: "{{ evdb_admin_user }}", group: "{{ evdb_group }}", mode: "0750"}
    - {path: "{{ evdb_bootstrap_runtime }}/instances", owner: "{{ evdb_admin_user }}", group: "{{ evdb_group }}", mode: "0750"}
    - {path: "{{ evdb_root }}/releases", owner: "{{ evdb_admin_user }}", group: "{{ evdb_admin_group }}", mode: "0755"}
    - {path: "{{ evdb_config_dir }}", owner: "{{ evdb_admin_user }}", group: "{{ evdb_group }}", mode: "0750"}
    - {path: "{{ evdb_secret_dir }}", owner: "{{ evdb_user }}", group: "{{ evdb_group }}", mode: "0700"}
    - {path: "{{ evdb_state_dir }}", owner: "{{ evdb_user }}", group: "{{ evdb_group }}", mode: "0700"}
    - {path: "{{ evdb_state_dir }}/backups", owner: "{{ evdb_user }}", group: "{{ evdb_group }}", mode: "0700"}
    - {path: "{{ evdb_state_dir }}/locks", owner: "{{ evdb_user }}", group: "{{ evdb_group }}", mode: "0700"}
    - {path: "{{ evdb_state_dir }}/state", owner: "{{ evdb_user }}", group: "{{ evdb_group }}", mode: "0700"}
    - {path: "{{ evdb_state_dir }}/rclone", owner: "{{ evdb_user }}", group: "{{ evdb_group }}", mode: "0700"}
  when: evdb_plan | bool
