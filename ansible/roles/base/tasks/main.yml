---
- name: Load host config
  ansible.builtin.include_vars:
    file: "{{ evdb_source_dir }}/host.yml"
    name: evdb_host

- name: Create service group
  ansible.builtin.group:
    name: "{{ evdb_group }}"
    system: true
  when:
    - evdb_manage_user | bool
    - evdb_write | bool

- name: Create service account
  ansible.builtin.user:
    name: "{{ evdb_user }}"
    group: "{{ evdb_group }}"
    groups:
      - docker
    append: true
    create_home: false
    shell: /usr/sbin/nologin
    system: true
  when:
    - evdb_manage_user | bool
    - evdb_write | bool

- name: Create deployment directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ evdb_root }}", owner: "{{ evdb_admin_user }}", group: "{{ evdb_admin_group }}", mode: "0755"}
    - {path: "{{ evdb_root }}/releases", owner: "{{ evdb_admin_user }}", group: "{{ evdb_admin_group }}", mode: "0755"}
    - {path: "{{ evdb_config_dir }}", owner: "{{ evdb_admin_user }}", group: "{{ evdb_group }}", mode: "0750"}
    - {path: "{{ evdb_secret_dir }}", owner: "{{ evdb_user }}", group: "{{ evdb_group }}", mode: "0700"}
    - {path: "{{ evdb_state_dir }}", owner: "{{ evdb_user }}", group: "{{ evdb_group }}", mode: "0700"}
    - {path: "{{ evdb_state_dir }}/backups", owner: "{{ evdb_user }}", group: "{{ evdb_group }}", mode: "0700"}
    - {path: "{{ evdb_state_dir }}/locks", owner: "{{ evdb_user }}", group: "{{ evdb_group }}", mode: "0700"}
    - {path: "{{ evdb_state_dir }}/state", owner: "{{ evdb_user }}", group: "{{ evdb_group }}", mode: "0700"}
    - {path: "{{ evdb_state_dir }}/rclone", owner: "{{ evdb_user }}", group: "{{ evdb_group }}", mode: "0700"}
  when: evdb_plan | bool
