---
- name: Install backup assets
  hosts: "{{ target | default('test') }}"
  become: "{{ evdb_become | default(true) }}"
  gather_facts: false
  pre_tasks:
    - name: Guard production execution
      ansible.builtin.assert:
        that:
          - "'production' not in group_names or target | default('') == 'production'"
          - "'production' not in group_names or ansible_check_mode or apply | default('no') == 'yes'"
        fail_msg: Production apply requires -e target=production -e apply=yes
  roles:
    - base
    - app
    - backup
  post_tasks:
    - name: Activate checked release
      ansible.builtin.include_role:
        name: app
        tasks_from: activate
