evdb_user: evanovation-db
evdb_group: evanovation-db
evdb_admin_user: root
evdb_admin_group: root
evdb_root: /opt/evanovation-db
evdb_runtime_root: "{{ evdb_root }}/host-runtime"
evdb_bootstrap_runtime: "{{ evdb_runtime_root }}/runtime"
evdb_config_dir: /etc/evanovation-db
evdb_secret_dir: /etc/evanovation-db/secrets
evdb_state_dir: /var/lib/evanovation-db
evdb_repo: "{{ playbook_dir }}/.."
evdb_python: /usr/bin/python3
evdb_manage_user: true

# Every write path requires the controller's post-confirmation apply flag.
evdb_write: "{{ apply | default('no') == 'yes' }}"
evdb_plan: "{{ evdb_write | bool or ansible_check_mode }}"
